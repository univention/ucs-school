bugs:
  58237:
    en: The hostname length limit has been increased from 13 to 15 characters. The old 13-character limit was introduced due to compatibility issues, which don't apply anymore. The new limit is adjusted to the limit for windows NETBIOS names.
    de: Die Längenbegrenzung für Hostnamen wurde von 13 auf 15 Zeichen erhöht. Das alte 13-Zeichen-Limit wurde aufgrund von Kompatibilitätsproblemen eingeführt, die nun nicht mehr gelten. Das neue Limit ist an das Limit für Windows NETBIOS-Namen angepasst.
  58250:
    en: A logic error in the UCS@school python library has been fixed that could have lead to tracebacks.
    de: Ein Logikfehler in der UCS@school-Python-Bibliothek wurde behoben, der zu einem Fehler führen konnte.
