bugs:
  58208:
    en: |
      Fix: The permissions of the PDF printer queue directory of exam users are now automatically corrected when the exam is started.
      Previously, it could happen that print jobs were sent by the exam user, but no print jobs appeared in the print moderation
    de: |
      Fix: Die Berechtigungen der PDF-Drucker-Verzeichnisse von Prüfungsbenutzern werden jetzt automatisch beim Start einer Klassenarbeit korrigiert.
      Zuvor konnte es vorkommen, dass Druckjobs zwar durch Prüfungsbenutzer abgesetzt wurden, diese aber nicht in der Druck-Moderation aufgetaucht sind.
