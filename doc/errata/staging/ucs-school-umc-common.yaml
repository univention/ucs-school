bugs:
  notes:
    en: |
      A new UCR variable ``ucsschool/umc/grid/show-email-instead-of-username``
      is registered. If set, the grid views of the UCS@school UMC modules
      display the primary email address instead of the username.
    de: |
      Eine neue UCR-Variable ``ucsschool/umc/grid/show-email-instead-of-username``
      wird registriert. Ist sie gesetzt, zeigen die UMC-Listenansichten der
      UCS@school-Module die primäre E-Mail-Adresse anstelle des Benutzernamens an.
