product: ucsschool
release: "5.2"
released:
version: [0]
scope: ucs_5.2-0-ucs-school-5.2
src: ucs-school-metapackage
fix: 17.1.1
bugs:
  55403:
    en: >
      On newly joined school servers, Kerberos SSO with Keycloak did not work for Windows clients,
      because the Samba of the school server missed the service principal name of Keycloak.
      The join script now adds it after Samba is set up.
      On existing school servers, run the pending join scripts with `univention-run-join-scripts` to add it.
    de: >
      Auf neu gejointen Schulservern funktionierte :spelling:ignore:`Kerberos-SSO` mit Keycloak für Windows-Clients nicht,
      weil im Samba des Schulservers der Service :spelling:ignore:`Principal` Name von Keycloak fehlte.
      Das :spelling:ignore:`Joinskript` fügt ihn jetzt hinzu, nachdem Samba eingerichtet ist.
      Auf bestehenden Schulservern muss dazu das ausstehende :spelling:ignore:`Joinskript` mit `univention-run-join-scripts` ausgeführt werden.
