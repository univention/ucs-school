  60101:
    en: >
      The job list in the UMC module *User Import* failed with an internal server error
      when import jobs were deleted while the list was loading,
      for example by the cleanup of old jobs after an import had finished.
    de: >
      Die Auftragsliste im UMC-Modul *Benutzerimport* schlug mit einem internen Serverfehler fehl,
      wenn während des Ladens Importaufträge gelöscht wurden,
      zum Beispiel durch das Aufräumen alter Aufträge nach Abschluss eines Imports.
