variables:
  IMAGE_UCS_EC2_TOOLS: "gitregistry.knut.univention.de/univention/dist/ucs-ec2-tools:latest"

include:
  - project: univention/infrastructure/docker-services
    file: pre-commit.yml
  - project: univention/internal/ucsschool-ci-utils
    file: fragments/openstack.yaml
  - project: univention/internal/ucsschool-ci-utils
    file: fragments/misc.yaml
  - local: .gitlab-ci/docs.yml
    rules:
      - if: $CI_COMMIT_MESSAGE =~ /skip-doc/ || $RUN_DOCS == "no"
        when: never
      - changes:
          paths:
            - "doc/ucsschool-import/**/*"
            - "doc/ucsschool-manual/**/*"
            - "doc/ucsschool-quickstart/**/*"
            - "doc/ucsschool-scenarios/**/*"
            - "doc/ucsschool-umc-user-import/**/*"
            - "doc/ucsschool-changelog/**/*"
            - "doc/errata/**/*"
        when: always

run pre-commit:
  stage: build
  extends: .pre-commit

lint_commit_messages:
  variables:
    HOOK_IDS: "conventional-pre-commit issue-reference"
  stage: build
  extends: .lint_commit_messages


integration_tests:
  extends: .run_openstack_cfg
  stage: test
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        paths:
          - "*/**/debian/changelog"
      when: manual
      allow_failure: False
  variables:
    TARGET_VERSION: "5.2-1"
    OPENSTACK_CFG_FILE: ".gitlab-ci/branch_tests.cfg"
    PACKAGES_TO_INSTALL: ""
  script:
    - mkdir results
    - git fetch --depth 1 origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME:compare
    - export PACKAGES_TO_INSTALL="$(git diff --name-only $CI_COMMIT_BRANCH compare | grep debian/changelog | sed 's/\(.*\)\/debian\/changelog/\1/g' | tr '\n' ' ') $PACKAGES_TO_INSTALL"
    - !reference [.run_openstack_cfg, script]
    - .gitlab-ci/parse_junit.py
  artifacts:
    reports:
      junit: results/**/test-reports/**/*.xml
