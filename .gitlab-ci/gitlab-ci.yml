variables:
  IMAGE_UCS_EC2_TOOLS: "gitregistry.knut.univention.de/univention/dist/ucs-ec2-tools:latest"

include:
  - local: .gitlab-ci/basedpyright-image.yml
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/pre-commit@2
    inputs:
      skip_hooks: "basedpyright-container-baseline"
      manual_stage_hooks: "basedpyright-native-baseline"
      commit_msg_hooks: "conventional-pre-commit issue-reference"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/python-type-hint-coverage-basedpyright@2
    inputs:
      pipeline_stage: build
      python_paths: --pythonpath /usr/bin/python3 .
      python_version: "3.11"
      uv_image: gitregistry.knut.univention.de/univention/dev/education/ucsschool/basedpyright-ucs:latest
      before_script:
        - uv sync --python 3.11
        - uv pip install --requirements requirements-typecheck.txt
      basedpyright_version: "1.39.8"
      baseline_file: basedpyright-baseline.json
      job_rules:
        - if: $CI_MERGE_REQUEST_ID
          changes:
            - "**/*.py"
            - pyproject.toml
            - uv.lock
            - basedpyright-baseline.json
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_COMMIT_TAG
  - project: univention/dev/tooling/ci-components
    file: fragments/openstack.yaml
  - project: univention/dev/tooling/ci-components
    file: fragments/misc.yaml
  - local: .gitlab-ci/docs.yml
    rules:
      - if: $CI_COMMIT_MESSAGE =~ /skip-doc/ || $RUN_DOCS == "no"
        when: never
      - changes:
          paths:
            - "doc/ucsschool-import/**/*"
            - "doc/ucsschool-manual/**/*"
            - "doc/ucsschool-quickstart/**/*"
            - "doc/ucsschool-scenarios/**/*"
            - "doc/ucsschool-umc-user-import/**/*"
            - "doc/ucsschool-changelog/**/*"
            - "doc/errata/**/*"
        when: always

# Run inside the basedpyright-ucs image (UCS packages + prek preinstalled) so
# the basedpyright-native-baseline hook resolves UCS imports without needing
# docker-in-docker.
run_pre_commit:
  image: gitregistry.knut.univention.de/univention/dev/education/ucsschool/basedpyright-ucs:latest

integration_tests:
  extends: .run_openstack_cfg
  stage: test
  timeout: 120 minutes
  needs:
    - parse-advisories
    - create_app_version
    - update_appcenter
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        paths:
          - "*/**/debian/changelog"
          - "appcenter/*/**"
        compare_to: "5.2"
      when: manual
      allow_failure: False
  variables:
    TARGET_VERSION: "5.2-5"
    OPENSTACK_CFG_FILE: ".gitlab-ci/branch_tests.cfg"
  script:
    - mkdir results
    - export PACKAGES_TO_TEST="$DEBIAN_SOURCE_DIRECTORIES"
    - export APPVERSION_TO_INSTALL="$APP_VERSION"
    - !reference [.run_openstack_cfg, script]
    - .gitlab-ci/parse_junit.py
  artifacts:
    reports:
      junit: results/**/test-reports/**/*.xml
