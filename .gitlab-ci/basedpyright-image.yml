include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "main"
    file:
      - "templates/kaniko.yaml"

variables:
  UCS_DEV_BRANCH:
    value: ""
    description: >-
      Optional: build basedpyright-ucs against this ucs repo dev branch slug
      (see docker/basedpyright-ucs/Dockerfile, ARG UCS_DEV_BRANCH) instead of
      the released errata channel. Leave empty for the normal, reproducible
      build.

build_basedpyright_image:
  extends: ".kaniko"
  stage: build
  variables:
    IMAGE_NAME: "basedpyright-ucs"
    KANIKO_BUILD_CONTEXT: "."
    DOCKERFILE_PATH: "docker/basedpyright-ucs/Dockerfile"
    KANIKO_ARGS: "--build-arg UCS_DEV_BRANCH=${UCS_DEV_BRANCH}"
  rules:
    - if: $UCS_DEV_BRANCH != ""
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - docker/basedpyright-ucs/Dockerfile
        - requirements-typecheck.txt
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG
