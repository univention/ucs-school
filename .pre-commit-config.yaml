# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
exclude: "^django-pam/"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^basedpyright-baseline.json
      - id: check-json
      - id: check-xml
      - id: check-yaml
        exclude: ".gitlab-ci/gitlab-ci.yml"
      - id: check-shebang-scripts-are-executable
        files: ^ucs-school-import-lusd/.*
      - id: check-executables-have-shebangs
        files: ^ucs-school-import-lusd/.*
      - id: trailing-whitespace
      - id: pretty-format-json
        args: [--autofix]
        files: ^ucs-school-import-lusd/.*
  - repo: https://git.knut.univention.de/univention/infrastructure/pre-commit-ucr
    rev: "0.1.7"
    hooks:
      - id: ucr-ruff-fix
        additional_dependencies: ["ruff==0.11.2"]
      - id: ucr-ruff-format
        additional_dependencies: ["ruff==0.11.2"]
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.12.11"
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-check
        alias: "ruff-unsafe"
        stages: [manual]
        args: ["--fix", "--unsafe-fixes"]
      - id: ruff-format
        alias: "ruff-format"
      - id: ruff
        alias: "ruff-statistics"
        stages: [ manual ]
        args: ["--statistics", "--unsafe-fixes"]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      # pygrep does not install an environment, so cannot use a language version.
      - id: python-check-blanket-noqa
      - id: python-no-eval
      - id: rst-backticks
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        files: ^ucs-school-import-lusd/.*
        additional_dependencies:
          - types-requests==2.32.0.20240712
          - pytest==8.3.2
          - pyjwt
        args: ["--strict", "--ignore-missing-imports"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^ucs-school-import-lusd/.*
  - repo: https://git.knut.univention.de/univention/infrastructure/pre-commit-debian.git
    rev: v1.1.0
    hooks:
      - id: debian-control
        exclude: ^(?!ucs-school-import-lusd\/).*$
      - id: debian-changelog
        exclude: ^(?!ucs-school-import-lusd\/).*$
  - repo: local
    hooks:
      - id: advisorycheck
        name: Check YAML errata advisories
        entry: ./.gitlab-ci/validate-advisories
        language: python
        types: ["yaml"]
        files: doc/errata/staging/.*
        exclude: doc/errata/staging/0template.yaml
        additional_dependencies:
          - pyyaml==6.0
  - repo: local
    hooks:
      - id: changelogchecks
        name: Checks on changelog modification
        entry: ./.gitlab-ci/changelog-checks
        language: python
        files: ucs-.*/debian/changelog
        exclude: ucs-test-ucsschool/debian/changelog
        additional_dependencies:
          - pyyaml==6.0
          - gitpython==3.1.43
          - python-debian==0.1.49

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.32
    hooks:
      - id: pymarkdown
        # TODO: clean those up:
        exclude: "^doc/devel/README.*.md$\
          |^(CODE_OF_CONDUCT|CONTRIBUTING|PULL_REQUEST_TEMPLATE|README).md$\
          |^ucs-school-import/.*.md$\
          |^.gitlab/issue_templates/default.md$\
          "
        args:
          - --disable-rules
          - MD013,MD024,MD034
          - scan
          # Rules pymarkdown: https://github.com/jackdewinter/pymarkdown/blob/main/docs/rules.md
          # Rules markdownlint: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
          # MD013: Allow arbitrary line length
          # MD024: Allow duplicate headings
          # MD034: Allow bare URLs
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
        args: ["--strict"]
  - repo: local
    hooks:
      - id: issue-reference
        stages: [ commit-msg ]
        name: issue-reference
        language: pygrep
        entry: '.*\n(\n(Issue ([a-zA-Z_/-]+)#\d+|Bug #\d+))+\n?(\n#.*)*\Z'
        args: ["--multiline", "--negate"]
  - repo: https://git.knut.univention.de/univention/infrastructure/pre-commit-hooks/pre-commit-copyright
    rev: 0.2.0
    hooks:
      - id: reuse-toml-dry-run
      - id: reuse-toml
        stages: [ manual ]
      - id: update-copyright-year
        stages: [ manual ]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        alias: reuse-annotate
        name: "reuse annotate"
        args: ["annotate", "-c", "Univention GmbH", "-l", "AGPL-3.0-only", "--skip-unrecognised", "--skip-existing", "--template", "univention"]
        pass_filenames: true
        description: "Annotate all unlicensed files as AGPL-3.0-only with Univention GmbH copyright"
        stages: [ manual ]
        # we have to specify everything covered by REUSE.toml again due to https://github.com/fsfe/reuse-tool/issues/1190
        # ignoring __init__.py due to https://github.com/fsfe/reuse-tool/issues/1179
        # MAKE SURE THIS IS IN SYNC WITH REUSE.toml / update-reuse-toml.py !
        <<: &common
          exclude: "^.*[.]1$\
                   |^doc/.*[.]csv\
                   |^doc/.*[.]svg\
                   |^doc/.*[.]jpeg\
                   |^doc/.*[.]jpg\
                   |^doc/.*[.]json\
                   |^doc/.*[.]png\
                   |^doc/.*[.]pdf\
                   |^doc/errata/.*[.]yaml$\
                   |^.*/umc/icons/.*[.]png\
                   |^.*/umc/icons/.*[.]svg\
                   |^.*/umc/icons/.*[.]svgz\
                   |^ucs-school-import/README.md\
                   |^ucs-school-import/examples/.*[.]csv\
                   |^ucs-school-import/usr/share/doc/.*\
                   |^ucs-school-import-lusd/usr/share/ucs-school-import-lusd/.*[.]json\
                   |^ucs-school-import-lusd/README.md\
                   |^ucs-school-import/usr/share/ucs-school-import/configs/.*[.]json\
                   |^ucs-school-import/usr/share/ucs-school-import/schema/.*[.]json\
                   |^ucs-school-metapackage/README.md\
                   |^ucs-school-metapackage/ucsschool[.]png\
                   |^ucs-school-metapackage/ucsschool[.]svg\
                   |^ucs-school-netlogon-user-logonscripts/.*[.]png\
                   |^ucs-school-umc-common/data/icons/scalable/category-ucs-school-.*[.]svg\
                   |^ucs-school-umc-lists/umc/js/schoollists/lo_import_hl_.*[.]png\
                   |^ucs-school-veyon-windows/README.md\
                   |^CODE_OF_CONDUCT.md\
                   |^CONTRIBUTING.md\
                   |^PULL_REQUEST_TEMPLATE.md\
                   |^SECURITY.md\
                   |^.*[.]cfg$\
                   |^.*[.]conf$\
                   |^ucs-test-ucsschool/[0-9].*$\
                   "
      - id: reuse
        alias: reuse-lint
        stages: [ manual ]
      - id: reuse-lint-file
  - repo: local
    hooks:
      - id: basedpyright-container-baseline
        name: basedpyright (relative to baseline)
        language: docker_image
        entry: |
          gitregistry.knut.univention.de/univention/dev/tooling/ci-components/uv:latest sh -c '
          export UV_CACHE_DIR=/src/.cache/uv/cache;
          export HOME=/src/.cache/uv/home;
          export XDG_CACHE_HOME=/src/.cache/uv/xdg-cache;
          export XDG_DATA_HOME=/src/.cache/uv/xdg-data;
          mkdir -p "$UV_CACHE_DIR" "$HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME";
          uvx --python 3.11 basedpyright \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --baselinemode=auto' --
        pass_filenames: false
        types: [python]

      - id: basedpyright-native-baseline
        name: basedpyright (relative to baseline, native)
        language: system
        entry: |
          sh -c 'uvx basedpyright \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --baselinemode=auto' --
        stages: [manual]
        pass_filenames: false
        types: [python]

      - id: basedpyright-container-no-baseline
        name: basedpyright (lint file, no baseline)
        language: docker_image
        entry: |
          gitregistry.knut.univention.de/univention/dev/tooling/ci-components/uv:latest sh -c '
          export UV_CACHE_DIR=/src/.cache/uv/cache;
          export HOME=/src/.cache/uv/home;
          export XDG_CACHE_HOME=/src/.cache/uv/xdg-cache;
          export XDG_DATA_HOME=/src/.cache/uv/xdg-data;
          mkdir -p "$UV_CACHE_DIR" "$HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME";
          uvx --python 3.11 basedpyright \
            --project pyrightconfig.json \
            --baselinefile /tmp/nonexistent-basedpyright-baseline.json' --
        stages: [manual]
        pass_filenames: true
        types: [python]

      - id: basedpyright-container-write-baseline
        name: basedpyright (write baseline)
        language: docker_image
        entry: |
          gitregistry.knut.univention.de/univention/dev/tooling/ci-components/uv:latest sh -c '
          export UV_CACHE_DIR=/src/.cache/uv/cache;
          export HOME=/src/.cache/uv/home;
          export XDG_CACHE_HOME=/src/.cache/uv/xdg-cache;
          export XDG_DATA_HOME=/src/.cache/uv/xdg-data;
          mkdir -p "$UV_CACHE_DIR" "$HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME";
          uvx --python 3.11 basedpyright \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --writebaseline .' --
        stages: [manual]
        pass_filenames: false


default_language_version:
  python: python3.11
