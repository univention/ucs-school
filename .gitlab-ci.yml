workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG
    - if: $RUN_UPDATE_RELEASE_ISSUE == "yes"
    - if: $RUN_RENOVATE == "yes"

stages:
  - prepare
  - build
  - test
  - release
  - cleanup

variables:
  RUN_DOCS:
    value: "yes"
    options:
      - "yes"
      - "no"
    description: "Run docs pipeline"
  FORCE_DOCS:
    value: "no"
    options:
      - "yes"
      - "no"
    description: "Force docs pipeline"
  RUN_UPDATE_RELEASE_ISSUE:
    value: "no"
    options:
      - "yes"
      - "no"
  RUN_RENOVATE:
    value: "no"
    options:
      - "yes"
      - "no"
    description: "Set to yes if you want to run renovate"

include:
  - local: .gitlab-ci/gitlab-ci.yml
    rules:
      - if: $RUN_UPDATE_RELEASE_ISSUE != "yes" && $RUN_RENOVATE != "yes"
  - local: .gitlab-ci/release.yml
    rules:
      - if: $RUN_UPDATE_RELEASE_ISSUE != "yes" && $RUN_RENOVATE != "yes"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sonarqube@2.16.1
    inputs:
      job_name: "build-sonar"
      stage: build
    rules:
      - if: $RUN_UPDATE_RELEASE_ISSUE != "yes" && $RUN_RENOVATE != "yes"
  - local: .gitlab-ci/update_release_issue.yml
    rules:
      - if: $RUN_UPDATE_RELEASE_ISSUE == "yes"
  # Gated on the same variable as the job it brings, so that a renovate run
  # consists of nothing but the renovate job and does not build the packages
  # and images along the way. The stage has to be one of the stages above,
  # which are part of this file and not of a gated include, so they apply to a
  # renovate run as well: the component's default 'deploy' is rejected with
  # "chosen stage deploy does not exist", and '.post' would keep the pipeline
  # from being created at all, because a pipeline whose only jobs are in '.pre'
  # or '.post' does not run. Which one it is does not matter, the job is alone.
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/renovate@2.16.1
    inputs:
      stage: prepare
    rules:
      - if: $RUN_RENOVATE == "yes"
